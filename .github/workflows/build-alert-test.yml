name: Build Verdant Alert Test

on:
  push:
    branches:
      - feature/verdant-hud-alert-priority
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Test Verdant alert logic
        run: npx vitest run src/lib/verdant-oracle-alerts.test.ts

      - name: Type-check Svelte and TypeScript
        run: npm run check

      - name: Disable upstream updater for this custom test build
        shell: pwsh
        run: |
          $path = "src-tauri/tauri.conf.json"
          $config = Get-Content $path -Raw | ConvertFrom-Json
          $config.bundle.createUpdaterArtifacts = $false
          $config.plugins.updater.active = $false
          $config | ConvertTo-Json -Depth 100 | Set-Content $path -Encoding utf8

      - name: Build Windows NSIS installer
        run: npm run tauri build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: cn-dps-ez-verdant-alerts-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
